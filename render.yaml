services:
  - type: web
    name: marko-dashboard
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false

    # SPA fallback — all paths serve index.html so React Router works
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Backend gateway URL — update to match your actual Render backend service name
      - key: VITE_API_BASE_URL
        value: https://marko-live.onrender.com
      - key: VITE_USE_MOCK
        value: false
